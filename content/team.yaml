  - name: Karina Paxton Filoteo
    title: Undergraduate Student
    photo: karina.jpg
    bio: >-
      Karina Paxton Filoteo is an undergraduate student studying Civil Engineering at
      Northwestern University. Passionate about resilience and adaptability in the built
      environment, Karina is researching the impact of porous metamaterials on evaporation
      and water flow for future application in permeable surfaces and facades. Karina won
      the 2026 McCormick Undergraduate Summer Research Grant enabling her to devote eight
      weeks of the summer to developing her research.
    links:
      email: karinapaxtonfiloteo2029@u.northwestern.edu
      linkedin: https://www.linkedin.com/in/karinapaxtonfiloteo/

  - name: Anderson Campbell
    title: Undergraduate Student
    photo: anderson.jpg
    bio: >-
      Anderson Campbell is a junior studying Mechanical Engineering at Northwestern
      University and pursuing the Segal Design Certificate. In the Adaptive Structures Lab,
      he researches hygromorphic structures that use moisture-driven deformation and
      snap-through instability to change shape in response to environmental conditions.
      His work focuses on the experimental design, fabrication, and testing of
      water-responsive structures, with the goal of developing passive, energy-efficient
      solutions for adaptive architecture. Anderson received funding through
      Northwestern’s Undergraduate Research Assistant Program (URAP) to continue his
      research as a paid undergraduate research assistant during the academic year.
      Outside the lab, he enjoys playing basketball and exploring new places.
    links:
      linkedin: https://www.linkedin.com/in/anderson-campbell-

  - name: Chealen Berry
    title: Undergraduate Student (Alum)
    alum: true
    photo: chealen.jpg
    bio: >-
      Chealen Berry is a senior at Northwestern University studying Civil Engineering with
      a minor in Spanish. She has had repeated internships with Thornton Tomasetti in
      Chicago, IL, and has co-authored a journal paper that is currently under review by
      the ASCE Journal of Structural Engineering in which she investigates the structural
      and facade damage caused by the 2020 Port of Beirut Blast. Following her studies at
      Northwestern, she plans to pursue a master’s degree and hopes to use her master’s
      thesis to investigate timber’s possible use in adaptive facades.
    links:
      email: chealenberry2024@u.northwestern.edu
