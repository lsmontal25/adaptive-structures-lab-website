intro_label: Team
intro_title: We are an interdisciplinary and *growing team*
intro_text: Please check the [Contact](/contact/) page for more information on how to join us. Click the images below to learn more about our group members.

people:
  - name: Lucia Stein-Montalvo
    title: Principal Investigator
    pi: true
    photo: lucia.jpg
    bio: >-
      Lucia Stein-Montalvo is the Principal Investigator of the Adaptive Structures Lab and
      an Assistant Professor in the Department of Civil and Environmental Engineering at
      Northwestern University. Her research focuses on the mechanics of instabilities and
      large deformations (i.e. “shape-shifting”), and how they can be used for adaptive
      architecture designs. Dr. Stein-Montalvo holds a PhD in Mechanical Engineering from
      Boston University, and a B.S. in Mathematics with a minor in Hispanic Studies from
      Davidson College. Prior to joining Northwestern, she was a Presidential Postdoctoral
      Research Fellow at Princeton University.
    links:
      email: lsmontal@northwestern.edu
      linkedin: https://www.linkedin.com/in/lsmontal/
      scholar: https://scholar.google.com/citations?user=egeO5c0AAAAJ&hl=en&oi=ao
      researchgate: https://www.researchgate.net/profile/Lucia-Stein-Montalvo-2

  - name: Paul Ducarme
    title: Postdoctoral Fellow
    photo: paul.jpg
    bio: |-
      Paul Ducarme is a NU Sustainability and Energy postdoctoral fellow. His research focuses on using mechanical instabilities to give buildings life-like properties, allowing architectural elements to suddenly change shape in order to adapt to and regulate humidity, temperature, ventilation, light, or air pollution.

      He obtained his PhD from the University of Amsterdam in May 2026, conducting his doctoral research on nonlinear materials and structures at the AMOLF and ARCNL institutes. Most notably, he experimentally demonstrated a new type of instability, called countersnapping, that allows structures to deform in previously impossible ways, becoming stronger as they snap.

      Outside the lab, Paul enjoys playing chess, photography, bike rides, and soccer.
    links:
      email: paul.ducarme@northwestern.edu
      website: https://paulducarme.com
      github: https://github.com/ducarme
      linkedin: https://www.linkedin.com/in/paul-ducarme/
      scholar: https://scholar.google.com/citations?user=rrctz-oAAAAJ&hl=en
      researchgate: https://www.researchgate.net/profile/Paul-Ducarme

