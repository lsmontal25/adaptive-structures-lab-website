  video_mp4: media/home-canopy.mp4
  about_title: About us
  about: >-
    In the Adaptive Structures Lab, we aim to understand and apply the mechanics of
    shape-shifting—that is, compelling structures to change shape on demand, or in
    response to a stimulus—for designs that can make the built environment more
    life-like and resilient. Our research is experimentally-driven, and informed by
    simulations and mathematical modeling.

