  join_title: Interested in joining us?
  join_note: "*Those at any career stage seeking fellowship funding are highly encouraged to reach out, even if no positions are currently posted in the group."
  join:
    - title: Prospective graduate students
      text: >-
        …should apply to the [Department of Civil and Environmental Engineering](https://www.mccormick.northwestern.edu/civil-environmental/academics/phd/)
        at Northwestern University. You are also welcome to reach out to Dr. Stein-Montalvo
        to schedule a meeting to discuss research directions and fit.
    - title: Prospective postdoctoral researchers
      text: >-
        …are encouraged to contact Dr. Stein-Montalvo directly. Please email a cover letter
        summarizing your past and current research, along with a brief description of your
        research interests and goals within the group, and your CV to
        [lsmontal@northwestern.edu](mailto:lsmontal@northwestern.edu).
    - title: Undergraduates
      text: >-
        …interested in pursuing research in the group are encouraged to reach out to
        Dr. Stein-Montalvo. Research can be performed as Independent Study (e.g. CIV_ENG 399
        for CEE students), and/or with a [SURG](https://undergradresearch.northwestern.edu/funding/surg/)
        or [AYURG](https://undergradresearch.northwestern.edu/funding/ayurg/). Work-study may also
        be an option. Please see the [Northwestern Office of Undergraduate Research page](https://undergradresearch.northwestern.edu)
        for FAQs and funding opportunities.
